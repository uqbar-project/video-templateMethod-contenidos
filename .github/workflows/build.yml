name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gradle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: zulu
          java-version: '14'

      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-provider: basic

      - name: Run tests and generate coverage
        run: ./gradlew runOnGitHub --no-daemon

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          use_oidc: true
          files: build/reports/jacoco/test/jacocoTestReport.xml
          disable_search: true
          fail_ci_if_error: true
